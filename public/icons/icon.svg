<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Heirloom</title>
  <defs>
    <!-- Slight hand-inked wobble on the strokes -->
    <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- Full-bleed square: iOS and Android round or mask the corners themselves -->
  <rect width="512" height="512" fill="#fdfbf7"/>
  <g transform="translate(66.0 100.2) scale(1.9)">
    <g stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#brush)">
      <path stroke="#2b353e" stroke-width="7" d="M 100,145 Q 60,130 20,140 Q 22,90 20,45 Q 60,35 100,50 Z"/>
      <path stroke="#2b353e" stroke-width="7" d="M 100,145 Q 140,130 180,140 Q 178,90 180,45 Q 140,35 100,50 Z"/>
      <path stroke="#2b353e" stroke-width="6" d="M 100,50 L 100,148"/>
      <path stroke="#2b353e" stroke-width="6" d="M 100,120 C 70,100 50,70 70,55 C 85,44 98,58 100,68"/>
      <path stroke="#2b353e" stroke-width="6" d="M 100,120 C 130,100 150,70 130,55 C 115,44 102,58 100,68"/>
      <path stroke="#55755e" stroke-width="5" d="M 100,65 Q 90,45 80,30 Q 95,30 100,45"/>
      <path stroke="#55755e" stroke-width="5" d="M 100,55 Q 110,35 120,20 Q 105,20 100,38"/>
      <circle cx="100" cy="18" r="3.5" fill="#55755e" stroke="none"/>
    </g>
  </g>
</svg>
